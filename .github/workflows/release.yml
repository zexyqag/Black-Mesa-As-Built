# The downloads: bmab for Windows and Linux, built with PyInstaller (bmab/frozen.py). A push to main whose commits since the last
# release include a fix or a feature is released as the next version (.github/release.py says which, from the commits'
# prefixes), with those commits' subjects as its notes, once both downloads have started and quit. Run by hand, a branch is
# built as 0.0.0-<branch>.g<sha> and kept as the run's artifacts. The redlines' address and the GitHub sign-in's client ID come
# from the repository's variables BMAB_REDLINES_REPO and BMAB_GITHUB_CLIENT_ID.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:  # one run at a time, each finding the release made before it
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, and the commits since the last release
      - id: next
        run: python3 .github/release.py next | tee -a "$GITHUB_OUTPUT"
  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - os: windows-2025
            name: windows
            options: --windowed --version-file version.txt
            archive: bmab-windows.zip
          - os: ubuntu-22.04  # an older glibc, so the download runs on older systems too
            name: linux
            options: ""
            archive: bmab-linux.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          python -m pip install pyinstaller
          python -c "import subprocess, sys, tomllib; subprocess.run([sys.executable, '-m', 'pip', 'install', *tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']], check=True)"
      - name: Settings
        env:
          BMAB_REDLINES_REPO: ${{ vars.BMAB_REDLINES_REPO }}
          BMAB_GITHUB_CLIENT_ID: ${{ vars.BMAB_GITHUB_CLIENT_ID }}
        run: |
          python -c "import json, os; json.dump({k: os.environ[k] for k in ('BMAB_REDLINES_REPO', 'BMAB_GITHUB_CLIENT_ID') if os.environ[k]} | {'BMAB_VERSION': os.environ['VERSION']}, open('settings.json', 'w'))"
          python .github/release.py versioninfo "$VERSION" > version.txt
      - name: Build
        # bmab's source goes in as well: it tells its versions apart (the views' cache) by its own files
        run: >
          pyinstaller --noconfirm --onedir --name bmab ${{ matrix.options }}
          --add-data "sources.json:." --add-data "sources.lock.json:." --add-data "settings.json:."
          --add-data "bmab/*.py:bmab" --add-data "bmab/*.html:bmab" --add-data "bmab/*.js:bmab"
          bmab/frozen.py
      - name: Git for Windows (MinGit)
        if: matrix.name == 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/git-for-windows/git/releases/latest --jq '.assets[] | select(.name | test("^MinGit-[0-9.]+-64-bit\\.zip$")) | .browser_download_url')
          echo "$url"
          curl -sSfL -o mingit.zip "$url"
          python -m zipfile -e mingit.zip dist/bmab/git
      - name: Archive
        run: |
          cd dist
          if [ "${{ matrix.name }}" = windows ]; then python -m zipfile -c "../${{ matrix.archive }}" bmab; else tar -czf "../${{ matrix.archive }}" bmab; fi
      - name: The download starts and quits
        run: python .github/release.py check "${{ matrix.archive }}" "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: bmab-${{ matrix.name }}
          path: ${{ matrix.archive }}
  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Release
        run: |
          # GitHub can run one push twice; the second run finds the release made
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is out already"; exit 0; fi
          python3 .github/release.py notes "${TAG#v}" > notes.md
          cat notes.md
          gh release create "$TAG" bmab-windows.zip bmab-linux.tar.gz --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

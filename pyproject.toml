[project]
name = "bmab"
dynamic = ["version"]  # the release's tag (.github/release.py)
description = "Reads Half-Life maps into one connected, placed model of the facility"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["numpy", "pillow", "scipy", "pywebview; sys_platform == 'win32'"]

[project.optional-dependencies]
speech = ["openai-whisper"]
gpu = ["torch"]

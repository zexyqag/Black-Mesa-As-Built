<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Black Mesa As Built: layout in 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel { position: absolute; top: 10px; left: 10px; background: rgba(15,15,22,0.88); padding: 10px 12px; border-radius: 6px;
           max-width: 300px; line-height: 1.6; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel label { display: block; cursor: pointer; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  input[type=range] { width: 100%; }
  #info { position: absolute; bottom: 10px; left: 10px; background: rgba(15,15,22,0.88); padding: 6px 10px; border-radius: 6px; }
  #help { position: absolute; bottom: 10px; right: 10px; color: #888; }
  #load { position: absolute; top: 45%; width: 100%; text-align: center; font-size: 16px; }
  hr { border: 0; border-top: 1px solid #333; margin: 6px 0; }
  .small { color: #999; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"></div>
<div id="panel">
  <h1 id="title"></h1>
  <div id="games"></div>
  <hr>
  <label><input type="checkbox" id="floors" checked> Floors</label>
  <label><input type="checkbox" id="walls" checked> Walls</label>
  <label><input type="checkbox" id="ceilings"> Ceilings</label>
  <label><input type="checkbox" id="joins" checked> Passages between maps (unseen)</label>
  <div class="small" id="joinkey"></div>
  <label id="bandrow"><input type="checkbox" id="band" checked> Ground band</label>
  <hr>
  <div>Height slice: <span id="slicetxt"></span></div>
  <input type="range" id="top" min="0" max="1000" value="1000">
  <input type="range" id="bottom" min="0" max="1000" value="0">
  <div class="small">top slider cuts from above, bottom from below</div>
  <hr>
  <button id="reset">Reset view</button>
</div>
<div id="info">Click a surface to name its map.</div>
<div id="help">left drag: orbit &nbsp; right drag: pan &nbsp; wheel: zoom</div>
<script type="application/octet-stream" id="geo">GEOMETRY</script>
<script>
/*WEBGL*/
</script>
<script>
"use strict";
const META = /*META*/null;
const $ = id => document.getElementById(id);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
let V, picked = -1;
const visible = META.games.map(() => true);
const lo = META.lo, hi = META.hi, M = META.metres;

function colours() {
  const n = META.maps.length, data = new Uint8Array(n * 4);
  META.maps.forEach((m, i) => data.set([...hex(META.games[m.game].colour), visible[m.game] ? 255 : 0], i * 4));
  V.selected = picked;
  V.setColours(data, n);
}
function controls() {
  V.show = [+$("floors").checked, +$("walls").checked, +$("ceilings").checked];
  V.showLines = $("joins").checked; V.showPlanes = $("band").checked;
  const t = +$("top").value / 1000, b = Math.min(+$("bottom").value / 1000, t);
  const zt = lo[2] + (hi[2] - lo[2]) * t, zb = lo[2] + (hi[2] - lo[2]) * b;
  const ref = META.band ? (META.band.lo + META.band.hi) / 2 : lo[2];
  $("slicetxt").textContent = `${Math.round((zb - ref) * M)} to ${Math.round((zt - ref) * M)} m` + (META.band ? " from the band's middle" : "");
  V.slice = [zb - 1, zt + 1];
  V.draw();
}
try {
  V = createViewer($("c"));
  V.setGeometry(decodeBase64($("geo").textContent.trim()), META.layout, lo, hi);
  const seg = js => js.flatMap(j => [...j.a, ...j.b]);
  V.setLines([{ pairs: seg(META.joins.filter(j => !j.inserted)), colour: [1, 0.85, 0.2, 1] },
              { pairs: seg(META.joins.filter(j => j.inserted)), colour: [1, 0.3, 0.9, 1] }]);
  const ins = META.joins.filter(j => j.inserted && j.label);
  $("joinkey").innerHTML = `<span style="color:#ffd933">yellow</span>: a join stretched over unseen space` +
    (ins.length ? `<br><span style="color:#ff4de6">pink</span>: an inserted unseen area (${ins.length}): ` + ins.map(j => j.label).join("; ") : "");
  if (META.band) V.setPlanes([META.band.lo, META.band.hi], [0.3, 0.8, 0.3, 0.12]); else $("bandrow").style.display = "none";
  V.onPick = id => {
    picked = id;
    $("info").textContent = id >= 0 ? `${META.maps[id].name} (${META.games[META.maps[id].game].name})` : "Click a surface to name its map.";
    colours();
  };
  $("title").textContent = META.title;
  META.games.forEach((g, k) => {
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" checked><span class="sw" style="background:${g.colour}"></span>${g.name}`;
    l.querySelector("input").addEventListener("input", e => { visible[k] = e.target.checked; colours(); });
    $("games").appendChild(l);
  });
  for (const id of ["floors", "walls", "ceilings", "joins", "band", "top", "bottom"]) $(id).addEventListener("input", controls);
  $("reset").addEventListener("click", () => { V.resetCam(); V.draw(); });
  colours(); controls(); V.render();
} catch (e) { $("load").textContent = "Could not show the layout: " + e.message; }
</script>
</body>
</html>
